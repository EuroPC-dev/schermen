<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="43200" />
  <title>Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #fullscreen-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background-color: black;
      z-index: 1;
      pointer-events: none; /* Voorkomt interactie met de video */
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background-color: #222;
      color: white;
      display: flex;
      align-items: center; /* Zorgt dat de middellijn van tijd en datum op één lijn ligt */
      justify-content: center;
      gap: 60px;
      padding: 0 30px;
      box-sizing: border-box;
      z-index: 10;
    }

    #tijd {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
    }

    #datum-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #datum-info {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: center;
    }

    #weekdag {
      font-size: 27px;
      font-weight: 700;
      line-height: 1;
    }

    #datum {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    #bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background-color: #222;
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 30px;
      box-sizing: border-box;
      font-size: 24px;
      font-weight: 600;
      z-index: 10;
      justify-content: space-between;
    }

    #bottom-left {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-grow: 1;
    }

    #nu-logo-container {
      background-color: white;
      border-radius: 50%;
      padding: 4px;
      height: 58px;
      width: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #nu-logo {
      height: 50px;
      width: 50px;
      pointer-events: none;
      user-select: none;
    }

    #bottom-news {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #weer {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 32px;
      font-weight: bold;
      margin-right: 10px;
    }

    #weer-icoon {
      width: 45px;
      height: 45px;
    }

    #logo {
      position: fixed;
      top: 1cm;
      right: calc(1cm + 20px);
      height: 150px;
      z-index: 20;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="tijd">--:--:--</div>
    <div id="datum-container">
      <div id="datum-info">
        <div id="weekdag">---</div>
        <div id="datum">-- -- ----</div>
      </div>
    </div>
  </div>

  <!-- YouTube Embedded Player -->
  <iframe 
    id="fullscreen-video" 
    src="https://www.youtube.com/embed?listType=playlist&list=PLeZLvM17wCjE&autoplay=1&mute=1&loop=1&controls=0&showinfo=0&rel=0" 
    allow="autoplay; encrypted-media" 
    allowfullscreen>
  </iframe>

  <div id="bottom-bar">
    <div id="bottom-left">
      <div id="nu-logo-container">
        <img id="nu-logo" src="nu.png" alt="Nu.nl logo" />
      </div>
      <div id="bottom-news">Nieuws laden...</div>
    </div>
    <div id="weer">
      <span id="temperatuur">--°C</span>
      <img id="weer-icoon" src="" alt="Weer" />
    </div>
  </div>

  <img id="logo" src="https://europc.nl/wp-content/uploads/logo-europc.svg" alt="EuroPC Logo" />

  <script>
    // Tijd & datum
    function updateTime() {
      const now = new Date();
      const dagen = ['Zondag', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag'];
      const maanden = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

      document.getElementById('tijd').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('weekdag').textContent = dagen[now.getDay()];
      document.getElementById('datum').textContent = `${now.getDate()} ${maanden[now.getMonth()]} ${now.getFullYear()}`;
    }

    setInterval(updateTime, 1000);
    updateTime();

    // Nieuws
    const bottomNews = document.getElementById('bottom-news');
    let nieuwsartikelen = [];
    let index = 0;

    async function laadNieuws() {
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.nu.nl/rss');
        const data = await response.json();
        nieuwsartikelen = data.items || [];

        if (nieuwsartikelen.length === 0) {
          bottomNews.textContent = 'Geen nieuws beschikbaar.';
          return;
        }

        toonNieuws();
        setInterval(toonNieuws, 5000);
      } catch (error) {
        bottomNews.textContent = 'Fout bij laden nieuws.';
      }
    }

    function toonNieuws() {
      const artikel = nieuwsartikelen[index];
      const textarea = document.createElement('textarea');
      textarea.innerHTML = artikel.title;
      bottomNews.textContent = textarea.value;
      index = (index + 1) % nieuwsartikelen.length;
    }

    laadNieuws();

    // Weer ophalen voor Maria Theresialaan, Roermond (Lat: 51.1837, Long: 5.9868)
    async function haalWeerOp() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=51.1837&longitude=5.9868&current=temperature_2m,weather_code&timezone=auto');
        const data = await response.json();
        const temperatuur = Math.round(data.current.temperature_2m);
        const weerCode = data.current.weather_code;

        const weerIconen = {
          0: '☀️', 1: '🌤️', 2: '☁️', 3: '☁️', 45: '🌫️', 48: '🌫️',
          51: '🌦️', 53: '🌧️', 55: '🌧️', 61: '🌧️', 63: '🌧️', 65: '🌧️',
          71: '🌨️', 73: '🌨️', 75: '🌨️', 80: '🌧️', 81: '🌧️', 82: '🌧️',
          95: '⛈️', 96: '⛈️', 99: '⛈️'
        };

        document.getElementById('temperatuur').textContent = `${temperatuur}°C`;
        const icoon = weerIconen[weerCode] || '❓';
        document.getElementById('weer-icoon').src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><text x="0" y="34" font-size="34">${icoon}</text></svg>`;
      } catch (e) {
        document.getElementById('temperatuur').textContent = '--°C';
      }
    }

    haalWeerOp();
    setInterval(haalWeerOp, 60 * 1000);
  </script>
</body>
</html>
